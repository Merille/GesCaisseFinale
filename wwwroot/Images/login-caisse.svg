<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Fond de la page de connexion GesCaisse : gestion de caisse (caisse enregistreuse,
       billets FCFA, tableau de bord, mobile money) aux couleurs M-ITECH AFRICA. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f44"/>
      <stop offset="0.55" stop-color="#12445f"/>
      <stop offset="1" stop-color="#195d84"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.48" r="0.42">
      <stop offset="0" stop-color="#2a7bab" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a7bab" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grille" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="billet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa36b"/>
      <stop offset="1" stop-color="#1f7a4c"/>
    </linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#d99a1e"/>
    </linearGradient>
    <linearGradient id="caisseCorps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef2"/>
      <stop offset="1" stop-color="#b9c6d0"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#04131c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#fond)"/>
  <rect width="1920" height="1080" fill="url(#grille)"/>
  <rect width="1920" height="1080" fill="url(#halo)"/>

  <!-- Arcs rappelant le logo M-ITECH AFRICA -->
  <g fill="none" stroke-linecap="round">
    <path d="M150 980 A 560 560 0 0 1 430 180" stroke="#999997" stroke-opacity="0.35" stroke-width="22"/>
    <path d="M90 1010 A 640 640 0 0 1 380 110" stroke="#2f86b8" stroke-opacity="0.35" stroke-width="22"/>
    <path d="M1770 100 A 560 560 0 0 1 1490 900" stroke="#999997" stroke-opacity="0.30" stroke-width="22"/>
    <path d="M1830 70 A 640 640 0 0 1 1540 970" stroke="#2f86b8" stroke-opacity="0.30" stroke-width="22"/>
  </g>

  <!-- ===================== Caisse enregistreuse (gauche) ===================== -->
  <g transform="translate(170 300)" filter="url(#ombre)">
    <!-- écran client -->
    <rect x="250" y="0" width="16" height="70" fill="#8597a5"/>
    <rect x="170" y="-60" width="180" height="70" rx="10" fill="#0e2a3b" stroke="#5b7d92" stroke-width="4"/>
    <text x="260" y="-14" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#7ff0b0">125 000</text>
    <!-- corps -->
    <path d="M40 90 H460 L500 380 H0 Z" fill="url(#caisseCorps)"/>
    <rect x="70" y="110" width="250" height="90" rx="10" fill="#0e2a3b"/>
    <text x="90" y="148" font-family="Arial, sans-serif" font-size="20" fill="#7fb6d6">TOTAL</text>
    <text x="300" y="185" text-anchor="end" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#7ff0b0">FCFA</text>
    <!-- clavier -->
    <g fill="#195d84">
      <rect x="80" y="225" width="44" height="30" rx="6"/><rect x="134" y="225" width="44" height="30" rx="6"/><rect x="188" y="225" width="44" height="30" rx="6"/><rect x="242" y="225" width="44" height="30" rx="6"/>
      <rect x="74" y="265" width="46" height="30" rx="6"/><rect x="130" y="265" width="46" height="30" rx="6"/><rect x="186" y="265" width="46" height="30" rx="6"/><rect x="242" y="265" width="46" height="30" rx="6"/>
      <rect x="68" y="305" width="48" height="30" rx="6"/><rect x="126" y="305" width="48" height="30" rx="6"/><rect x="184" y="305" width="48" height="30" rx="6"/>
    </g>
    <rect x="242" y="305" width="48" height="30" rx="6" fill="#1f9d5c"/>
    <!-- ticket qui sort -->
    <rect x="345" y="40" width="100" height="90" fill="#ffffff"/>
    <g stroke="#b9c6d0" stroke-width="5" stroke-linecap="round">
      <line x1="360" y1="62" x2="430" y2="62"/><line x1="360" y1="80" x2="415" y2="80"/><line x1="360" y1="98" x2="430" y2="98"/>
    </g>
    <path d="M345 130 l12 10 l12 -10 l13 10 l12 -10 l13 10 l12 -10 l13 10 l13 -10 V128 H345 Z" fill="#ffffff"/>
    <rect x="335" y="118" width="120" height="16" rx="4" fill="#8597a5"/>
    <!-- tiroir ouvert -->
    <path d="M-20 380 H520 L540 470 H-40 Z" fill="#9aabb8"/>
    <rect x="-40" y="470" width="580" height="40" rx="6" fill="#7a8d9b"/>
    <!-- billets dans le tiroir -->
    <g>
      <rect x="10" y="392" width="120" height="58" rx="5" fill="url(#billet)"/>
      <rect x="145" y="392" width="120" height="58" rx="5" fill="#2f86b8"/>
      <rect x="280" y="392" width="120" height="58" rx="5" fill="#d9822b"/>
      <rect x="415" y="392" width="90" height="58" rx="5" fill="url(#billet)"/>
      <g fill="#ffffff" fill-opacity="0.85" font-family="Arial, sans-serif" font-weight="700" font-size="18">
        <text x="70" y="428" text-anchor="middle">10 000</text>
        <text x="205" y="428" text-anchor="middle">5 000</text>
        <text x="340" y="428" text-anchor="middle">2 000</text>
      </g>
    </g>
  </g>

  <!-- Pièces (bas gauche) -->
  <g transform="translate(250 900)" filter="url(#ombre)">
    <g>
      <ellipse cx="0" cy="40" rx="62" ry="18" fill="#c4861a"/><rect x="-62" y="10" width="124" height="30" fill="#d99a1e"/><ellipse cx="0" cy="10" rx="62" ry="18" fill="url(#piece)"/>
      <ellipse cx="0" cy="-12" rx="62" ry="18" fill="#c4861a"/><rect x="-62" y="-42" width="124" height="30" fill="#d99a1e"/><ellipse cx="0" cy="-42" rx="62" ry="18" fill="url(#piece)"/>
      <text x="0" y="-36" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#8a5a0b">500</text>
    </g>
    <g transform="translate(150 30)">
      <ellipse cx="0" cy="20" rx="52" ry="15" fill="#c4861a"/><rect x="-52" y="-6" width="104" height="26" fill="#d99a1e"/><ellipse cx="0" cy="-6" rx="52" ry="15" fill="url(#piece)"/>
      <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#8a5a0b">100</text>
    </g>
  </g>

  <!-- ===================== Tableau de bord (droite) ===================== -->
  <g transform="translate(1340 230)" filter="url(#ombre)">
    <rect width="440" height="300" rx="22" fill="#ffffff"/>
    <text x="30" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f1b33">Solde en caisse</text>
    <text x="30" y="98" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#195d84">1 472 299</text>
    <text x="252" y="98" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6b6b69">FCFA</text>
    <!-- barres entrées / sorties -->
    <g transform="translate(30 270)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#dbe3ea" stroke-width="3"/>
      <rect x="10" y="-60" width="22" height="60" rx="4" fill="#0f7a4a"/><rect x="36" y="-30" width="22" height="30" rx="4" fill="#f59e5b"/>
      <rect x="90" y="-95" width="22" height="95" rx="4" fill="#0f7a4a"/><rect x="116" y="-40" width="22" height="40" rx="4" fill="#f59e5b"/>
      <rect x="170" y="-75" width="22" height="75" rx="4" fill="#0f7a4a"/><rect x="196" y="-55" width="22" height="55" rx="4" fill="#f59e5b"/>
      <rect x="250" y="-125" width="22" height="125" rx="4" fill="#0f7a4a"/><rect x="276" y="-35" width="22" height="35" rx="4" fill="#f59e5b"/>
      <rect x="330" y="-140" width="22" height="140" rx="4" fill="#0f7a4a"/><rect x="356" y="-50" width="22" height="50" rx="4" fill="#f59e5b"/>
      <polyline points="21,-80 101,-112 181,-96 261,-142 341,-158" fill="none" stroke="#195d84" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="341" cy="-158" r="9" fill="#195d84" stroke="#ffffff" stroke-width="4"/>
    </g>
  </g>

  <!-- Badge « Validé » -->
  <g transform="translate(1600 600)" filter="url(#ombre)">
    <rect width="230" height="78" rx="39" fill="#ffffff"/>
    <circle cx="40" cy="39" r="24" fill="#1f9d5c"/>
    <path d="M28 40 l9 9 l17 -19" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="47" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f1b33">Validé</text>
  </g>

  <!-- Téléphone Mobile Money -->
  <g transform="translate(1390 640) rotate(-8)" filter="url(#ombre)">
    <rect width="170" height="300" rx="26" fill="#0e2a3b"/>
    <rect x="12" y="34" width="146" height="234" rx="10" fill="#e8f0f5"/>
    <rect x="62" y="14" width="46" height="8" rx="4" fill="#3b5566"/>
    <rect x="24" y="52" width="122" height="44" rx="8" fill="#f2b400"/>
    <text x="85" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#0e2a3b">Mobile Money</text>
    <text x="85" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b6b69">Paiement reçu</text>
    <text x="85" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#0f7a4a">+42 500</text>
    <text x="85" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6b6b69">FCFA</text>
    <rect x="34" y="220" width="102" height="30" rx="15" fill="#195d84"/>
  </g>

  <!-- Liasse de billets (bas droite) -->
  <g transform="translate(1620 930) rotate(10)" filter="url(#ombre)">
    <rect x="-110" y="-38" width="220" height="96" rx="8" fill="#1a6b43"/>
    <rect x="-110" y="-52" width="220" height="96" rx="8" fill="url(#billet)"/>
    <circle cx="0" cy="-4" r="28" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff">F</text>
    <rect x="-24" y="-52" width="48" height="96" fill="#f2f2f2" fill-opacity="0.9"/>
    <text x="0" y="1" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#195d84">10 000</text>
  </g>

  <!-- Billets qui flottent -->
  <g filter="url(#ombre)">
    <g transform="translate(760 150) rotate(-14)">
      <rect width="150" height="70" rx="6" fill="url(#billet)"/>
      <circle cx="75" cy="35" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
      <text x="75" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#ffffff">F</text>
    </g>
    <g transform="translate(1120 900) rotate(12)">
      <rect width="150" height="70" rx="6" fill="#2f86b8"/>
      <circle cx="75" cy="35" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
      <text x="75" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#ffffff">F</text>
    </g>
  </g>
</svg>
