<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Hors connexion - GesCaisse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b5e84">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f7fb; font-family: 'Segoe UI', system-ui, sans-serif; color: #1e293b; }
        .carte { width: min(460px, calc(100vw - 32px)); background: #fff; border-radius: 16px; box-shadow: 0 6px 30px rgba(15, 23, 42, .08); padding: 28px; }
        .logo { width: 48px; height: 48px; border-radius: 12px; background: #1b5e84; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        h1 { font-size: 20px; margin: 16px 0 6px; }
        p { color: #475569; line-height: 1.5; margin: 0 0 16px; }
        a.caisse { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #dbe4ec; border-radius: 10px; text-decoration: none; color: #0b2f44; margin-bottom: 8px; }
        a.caisse:hover { border-color: #1b5e84; background: #f0f6fa; }
        a.caisse small { display: block; color: #64748b; }
        button { margin-top: 8px; width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #1b5e84; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
        .vide { padding: 12px 14px; border-radius: 10px; background: #fff7ed; color: #9a3412; font-size: 14px; }
    </style>
</head>
<body>
<div class="carte">
    <div class="logo">GC</div>
    <h1>Pas de connexion au serveur</h1>
    <p>Cette page n'est pas disponible hors ligne. L'écran de vente des caisses déjà ouvertes sur ce poste reste utilisable :</p>
    <div id="caisses"></div>
    <button type="button" onclick="location.reload()">Réessayer</button>
</div>
<script>
    // Caisses enregistrées sur ce poste (pages de l'écran de vente gardées par le service worker).
    (async function () {
        const zone = document.getElementById('caisses');
        let html = '';
        try {
            const cache = await caches.open('gc-pages');
            for (const req of await cache.keys()) {
                let titre = 'Écran de vente', detail = '';
                try {
                    const texte = await (await cache.match(req)).text();
                    const m = texte.match(/<script id="pos-donnees" type="application\/json">([\s\S]*?)<\/script>/);
                    const d = m ? JSON.parse(m[1]) : null;
                    if (d && d.journee) { titre = d.journee.caisse || titre; detail = d.journee.libelle || ''; }
                } catch (e) { /* page illisible : titre par défaut */ }
                const echap = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
                html += '<a class="caisse" href="' + echap(req.url) + '"><span><strong>' + echap(titre) + '</strong><small>' + echap(detail) + '</small></span><span>›</span></a>';
            }
        } catch (e) { /* navigateur sans cache */ }
        zone.innerHTML = html || '<div class="vide">Aucune caisse n\'a encore été ouverte sur ce poste. Ouvrez l\'écran de vente une fois avec la connexion pour pouvoir le reprendre hors ligne.</div>';
    })();
</script>
</body>
</html>
